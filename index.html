<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>창문 너머</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
:root{
  --night:#141a2e; --night2:#223052; --frame:#e9e6df; --lamp:#f3c77a;
  --wall:#4a3326; --ink:#2b2118; --left:#6edafb; --right:#ff8937;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,var(--night2),var(--night) 70%);
  font-family:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.window{position:relative;width:min(94vw,520px);height:min(70vh,520px);border:8px solid var(--frame);
  background:linear-gradient(#5a4030,var(--wall));overflow:hidden;
  box-shadow:0 0 60px 6px rgba(243,199,122,.18)}
.curtain{position:absolute;top:0;bottom:0;width:50%;z-index:2;
  background:repeating-linear-gradient(90deg,#6b3b3b 0 12px,#582e2e 12px 24px);
  transition:transform 2s cubic-bezier(.6,.05,.3,1)}
.curtain.l{left:0}.curtain.r{right:0}
.open .curtain.l{transform:translateX(-101%)}
.open .curtain.r{transform:translateX(101%)}
.title{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  padding:24px;text-align:center;font-size:clamp(26px,6vw,34px);font-weight:700;line-height:1.5;
  color:#fbefd2;text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:0;transition:opacity 1s}
.title.show{opacity:1}
.bubble{position:absolute;top:50%;width:max-content;transform:translate(-50%,-50%);opacity:0;transition:opacity .7s}
.bubble.show{opacity:1}
.bubble.a{left:41%;color:var(--left)}
.bubble.b{left:59%;color:var(--right)}
#shape{position:absolute;overflow:visible;z-index:0}
.txt{position:relative;z-index:1;color:var(--ink);text-align:center;
  font-size:clamp(20px,4.6vw,25px);font-weight:700;line-height:1.4;word-break:keep-all}
button{font:inherit;font-size:18px;background:none;color:var(--lamp);border:1px solid var(--lamp);
  border-radius:20px;padding:6px 18px;cursor:pointer;visibility:hidden}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.curtain,.title,.bubble{transition-duration:.01s}}
</style>
</head>
<body>
<div class="window" id="win" role="img" aria-label="창문 너머로 보이는 두 사람의 대화">
  <div class="bubble" id="bubble"><svg id="shape"></svg><div class="txt" id="txt"></div></div>
  <div class="curtain l"></div><div class="curtain r"></div>
  <div class="title" id="title"></div>
</div>
<button id="again">다시 엿보기</button>

<script>
// ▼ 여기만 고치면 대화가 바뀝니다. who: "a"(왼쪽) 또는 "b"(오른쪽)
const names = { a: "야부키 신고", b: "쿠사나기 쿄" };
const script = [
  { who: "a", text: "쿄 선배, 냉장고에 넣어둔 푸딩 못 봤어요?" },
  { who: "b", text: "…못 봤는데." },
  { who: "a", text: "입가에 카라멜 묻어 있는데요." },
  { who: "b", text: "아침에 얼핏 본 것 같기도 하고." },
  { who: "a", text: "그거 제가 아껴둔 거였어요!" },
  { who: "b", text: "설거지는 내가 할게. 그걸로 됐지?" },
  { who: "a", text: "그럼 빨래도 선배가…" },
  { who: "b", text: "푸딩 하나에 요구가 너무 많은데." }
];

const win = document.getElementById("win");
const title = document.getElementById("title");
const bubble = document.getElementById("bubble");
const txt = document.getElementById("txt");
const shape = document.getElementById("shape");

// 꼬리가 달린 말풍선 모양을 먼저 하나로 그리고, 그 바깥에 테두리를 입힙니다
function drawBubble(who){
  bubble.style.maxWidth = (win.clientWidth * 0.5) + "px";
  const w = txt.offsetWidth, h = txt.offsetHeight;
  const rx = w / 2 * 1.42 + 16, ry = h / 2 * 1.42 + 14;
  const SW = Math.ceil(2 * rx + 20), SH = Math.ceil(2 * ry + 56);
  const cx = SW / 2, cy = ry + 10;
  const pt = (deg, k) => [cx + rx * k * Math.cos(deg * Math.PI / 180), cy + ry * k * Math.sin(deg * Math.PI / 180)];
  const s = who === "a" ? -1 : 1;
  const yOn = x => cy + ry * Math.sqrt(Math.max(0, 1 - Math.pow((x - cx) / rx, 2)));
  const x1 = cx + s * rx * 0.42, x2 = x1 + s * 20;   // 꼬리 밑동 폭 약 20px (가늘게)
  const b1 = [x1, yOn(x1) - 3], b2 = [x2, yOn(x2) - 3];
  const tip = [cx + s * rx * 0.62, cy + ry + 28];
  shape.setAttribute("width", SW); shape.setAttribute("height", SH);
  shape.style.left = (w / 2 - SW / 2) + "px";
  shape.style.top = (h / 2 - cy) + "px";
  const parts = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/><path d="M${b1} Q${x1 + s * 6},${cy + ry + 6} ${tip} Q${x2},${cy + ry} ${b2} Z"/>`;
  shape.innerHTML = `<g fill="currentColor" stroke="currentColor" stroke-width="10" stroke-linejoin="round">${parts}</g><g fill="#fff">${parts}</g>`;
}
const again = document.getElementById("again");
const wait = ms => new Promise(r => setTimeout(r, ms));
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 받침 유무에 따라 "와/과" 자동 선택
const josa = n => ((n.charCodeAt(n.length - 1) - 0xAC00) % 28 === 0) ? "와" : "과";
title.textContent = `${names.a}${josa(names.a)} ${names.b}의 대화`;

async function play(){
  again.style.visibility = "hidden";
  bubble.className = "bubble";
  title.classList.remove("show");
  const cs = win.querySelectorAll(".curtain");
  cs.forEach(c => c.style.transition = "none");
  win.classList.remove("open");
  void win.offsetWidth;
  cs.forEach(c => c.style.transition = "");

  await wait(600);
  title.classList.add("show");  await wait(calm ? 1500 : 3000);
  title.classList.remove("show"); await wait(1100);
  win.classList.add("open");    await wait(calm ? 300 : 2300);

  for (const line of script){
    bubble.className = "bubble " + line.who;
    txt.textContent = line.text;
    drawBubble(line.who);
    void bubble.offsetWidth;
    bubble.classList.add("show");
    await wait(900 + line.text.length * 110);
    bubble.classList.remove("show");
    await wait(900);
  }
  again.style.visibility = "visible";
}
again.onclick = play;
play();
</script>
</body>
</html>
